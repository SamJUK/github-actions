version: 2
updates:
  # Every action here is pinned by SHA, and nothing was moving the pins: checkout is still v4,
  # which runners now force from Node 20 onto Node 24 with a deprecation warning.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*/*"
    assignees:
      - "SamJUK"
    schedule:
      interval: "monthly"
      time: "08:00"
      timezone: "Europe/London"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
