name: "Compute Magento Software Requirements"
author: "SamJUK"
description: "A Github Action computes Magento Software Requirements"

inputs:
  magento_version:
    description: "Magento Verison"
    required: true
  distribution:
    description: "Product distribution ('magento' or 'mage-os')"
    required: false
    default: "magento"

outputs:
  composer:
    description: "Composer Version"
    value: ${{ steps.extract-software-requirements.outputs.composer }}
  php:
    description: "PHP Version"
    value: ${{ steps.extract-software-requirements.outputs.php }}
  mysql:
    description: "MySQL Version"
    value: ${{ steps.extract-software-requirements.outputs.mysql }}
  mariadb:
    description: "MariaDB Version"
    value: ${{ steps.extract-software-requirements.outputs.mariadb }}
  elasticsearch:
    description: "Elasticsearch Version"
    value: ${{ steps.extract-software-requirements.outputs.elasticsearch }}
  opensearch:
    description: "OpenSearch Version"
    value: ${{ steps.extract-software-requirements.outputs.opensearch }}
  redis:
    description: "Redis Version"
    value: ${{ steps.extract-software-requirements.outputs.redis }}
  valkey:
    description: "Valkey Key Version"
    value: ${{ steps.extract-software-requirements.outputs.valkey }}
  apache:
    description: "Apache Version"
    value: ${{ steps.extract-software-requirements.outputs.apache }}
  nginx:
    description: "Nginx Version"
    value: ${{ steps.extract-software-requirements.outputs.nginx }}
  varnish:
    description: "Varnish Version"
    value: ${{ steps.extract-software-requirements.outputs.varnish }}
  rabbitmq:
    description: "RabbitMQ Version"
    value: ${{ steps.extract-software-requirements.outputs.rabbitmq }}
  activemq_artemis:
    description: "ActiveMQ Artemis Version"
    value: ${{ steps.extract-software-requirements.outputs.activemq_artemis }}
  database:
    description: "Database to test against: mariadb or mysql"
    value: ${{ steps.extract-software-requirements.outputs.database || 'mysql' }}
  database_image:
    description: "Docker image for the database service"
    value: ${{ steps.extract-software-requirements.outputs.database == 'mariadb' && format('mariadb:{0}', steps.extract-software-requirements.outputs.mariadb) || format('mysql:{0}', steps.extract-software-requirements.outputs.mysql) }}
  cache:
    description: "Cache to test against: valkey or redis"
    value: ${{ steps.extract-software-requirements.outputs.cache || 'redis' }}
  cache_image:
    description: "Docker image for the cache service"
    value: ${{ steps.extract-software-requirements.outputs.cache == 'valkey' && format('valkey/valkey:{0}', steps.extract-software-requirements.outputs.valkey) || format('redis:{0}', steps.extract-software-requirements.outputs.redis) }}

runs:
  using: composite
  steps:
    - name: Extract Software Requirements
      id: extract-software-requirements
      shell: bash
      run: |
        jq -r --arg d ${INPUTS_DISTRIBUTION} --arg v ${INPUTS_MAGENTO_VERSION} '.[$d][$v] | to_entries | map("\(.key)=\(.value|tostring)") | .[]' ${{ github.action_path }}/manifest.json >> "$GITHUB_OUTPUT"
      env:
        INPUTS_DISTRIBUTION: ${{ inputs.distribution }}
        INPUTS_MAGENTO_VERSION: ${{ inputs.magento_version }}

    - name: Debug Github Output
      shell: bash
      run: |
        echo "composer=${STEPS_EXTRACT_SOFTWARE_REQUIREMENTS_OUTPUTS_COMPOSER}"
        echo "php=${STEPS_EXTRACT_SOFTWARE_REQUIREMENTS_OUTPUTS_PHP}"
        echo "mysql=${STEPS_EXTRACT_SOFTWARE_REQUIREMENTS_OUTPUTS_MYSQL}"
        echo "mariadb=${STEPS_EXTRACT_SOFTWARE_REQUIREMENTS_OUTPUTS_MARIADB}"
        echo "elasticsearch=${STEPS_EXTRACT_SOFTWARE_REQUIREMENTS_OUTPUTS_ELASTICSEARCH}"
        echo "opensearch=${STEPS_EXTRACT_SOFTWARE_REQUIREMENTS_OUTPUTS_OPENSEARCH}"
        echo "redis=${STEPS_EXTRACT_SOFTWARE_REQUIREMENTS_OUTPUTS_REDIS}"
        echo "valkey=${STEPS_EXTRACT_SOFTWARE_REQUIREMENTS_OUTPUTS_VALKEY}"
        echo "apache=${STEPS_EXTRACT_SOFTWARE_REQUIREMENTS_OUTPUTS_APACHE}"
        echo "nginx=${STEPS_EXTRACT_SOFTWARE_REQUIREMENTS_OUTPUTS_NGINX}"
        echo "varnish=${STEPS_EXTRACT_SOFTWARE_REQUIREMENTS_OUTPUTS_VARNISH}"
        echo "rabbitmq=${STEPS_EXTRACT_SOFTWARE_REQUIREMENTS_OUTPUTS_RABBITMQ}"
        echo "activemq_artemis=${STEPS_EXTRACT_SOFTWARE_REQUIREMENTS_OUTPUTS_ACTIVEMQ_ARTEMIS}"
      env:
        STEPS_EXTRACT_SOFTWARE_REQUIREMENTS_OUTPUTS_COMPOSER: ${{ steps.extract-software-requirements.outputs.composer }}
        STEPS_EXTRACT_SOFTWARE_REQUIREMENTS_OUTPUTS_PHP: ${{ steps.extract-software-requirements.outputs.php }}
        STEPS_EXTRACT_SOFTWARE_REQUIREMENTS_OUTPUTS_MYSQL: ${{ steps.extract-software-requirements.outputs.mysql }}
        STEPS_EXTRACT_SOFTWARE_REQUIREMENTS_OUTPUTS_MARIADB: ${{ steps.extract-software-requirements.outputs.mariadb }}
        STEPS_EXTRACT_SOFTWARE_REQUIREMENTS_OUTPUTS_ELASTICSEARCH: ${{ steps.extract-software-requirements.outputs.elasticsearch }}
        STEPS_EXTRACT_SOFTWARE_REQUIREMENTS_OUTPUTS_OPENSEARCH: ${{ steps.extract-software-requirements.outputs.opensearch }}
        STEPS_EXTRACT_SOFTWARE_REQUIREMENTS_OUTPUTS_REDIS: ${{ steps.extract-software-requirements.outputs.redis }}
        STEPS_EXTRACT_SOFTWARE_REQUIREMENTS_OUTPUTS_VALKEY: ${{ steps.extract-software-requirements.outputs.valkey }}
        STEPS_EXTRACT_SOFTWARE_REQUIREMENTS_OUTPUTS_APACHE: ${{ steps.extract-software-requirements.outputs.apache }}
        STEPS_EXTRACT_SOFTWARE_REQUIREMENTS_OUTPUTS_NGINX: ${{ steps.extract-software-requirements.outputs.nginx }}
        STEPS_EXTRACT_SOFTWARE_REQUIREMENTS_OUTPUTS_VARNISH: ${{ steps.extract-software-requirements.outputs.varnish }}
        STEPS_EXTRACT_SOFTWARE_REQUIREMENTS_OUTPUTS_RABBITMQ: ${{ steps.extract-software-requirements.outputs.rabbitmq }}
        STEPS_EXTRACT_SOFTWARE_REQUIREMENTS_OUTPUTS_ACTIVEMQ_ARTEMIS: ${{ steps.extract-software-requirements.outputs.activemq_artemis }}
