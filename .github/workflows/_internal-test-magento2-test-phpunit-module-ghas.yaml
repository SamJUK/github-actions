name: Test magento2-test-phpunit-module-ghas

# .github/fixtures/demo-package-no-tests (no Test/ at all) only warns now, so the magento2-module self-test runs it.
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/magento2-test-phpunit-module-ghas.yaml
      - .github/workflows/_internal-test-magento2-test-phpunit-module-ghas.yaml
      - .github/actions/magento/compute-software-requirements/**
      - .github/actions/php/lint/**
      - .github/fixtures/demo-package/**
      - .github/fixtures/demo-package-unit-only/**
  pull_request:
    paths:
      - .github/workflows/magento2-test-phpunit-module-ghas.yaml
      - .github/workflows/_internal-test-magento2-test-phpunit-module-ghas.yaml
      - .github/actions/magento/compute-software-requirements/**
      - .github/actions/php/lint/**
      - .github/fixtures/demo-package/**
      - .github/fixtures/demo-package-unit-only/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  supported-versions:
    uses: ./.github/workflows/magento-supported-versions.yaml

  # Every supported version against the services its manifest entry names.
  test-supported-versions:
    needs: supported-versions
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.supported-versions.outputs.versions) }}
    uses: ./.github/workflows/magento2-test-phpunit-module-ghas.yaml
    with:
      module_path: ./extensions/${{ github.event.repository.name }}/.github/fixtures/demo-package
      magento_version: ${{ matrix.version }}
      magento_distribution: ${{ matrix.distribution }}
      run_integration_tests: true

  test-unit-tests:
    uses: ./.github/workflows/magento2-test-phpunit-module-ghas.yaml
    with:
      module_path: ./extensions/${{ github.event.repository.name }}/.github/fixtures/demo-package
      run_unit_tests: true

  test-integration-tests:
    uses: ./.github/workflows/magento2-test-phpunit-module-ghas.yaml
    with:
      module_path: ./extensions/${{ github.event.repository.name }}/.github/fixtures/demo-package
      run_integration_tests: true

  # Both flags on, but the module only has Test/Unit - proves integration is skipped
  # gracefully instead of phpunit hard-failing on a missing directory.
  test-graceful-skip-missing-integration:
    uses: ./.github/workflows/magento2-test-phpunit-module-ghas.yaml
    with:
      module_path: ./extensions/${{ github.event.repository.name }}/.github/fixtures/demo-package-unit-only
      run_unit_tests: true
      run_integration_tests: true

  # 2.4.6-p15 pins PHPUnit 9.x, which rejects --display-all-issues (added in PHPUnit 10) -
  # proves the runtime flag-detection step omits it instead of hard-failing.
  test-old-phpunit-compat:
    uses: ./.github/workflows/magento2-test-phpunit-module-ghas.yaml
    with:
      module_path: ./extensions/${{ github.event.repository.name }}/.github/fixtures/demo-package
      magento_version: '2.4.6-p15'
      run_unit_tests: true

  # magento_distribution: mage-os - proves the container image swaps to
  # mage-os-ci-testing-env and the software-requirements lookup resolves under the
  # "mage-os" manifest key instead of "magento".
  test-mageos-compat:
    uses: ./.github/workflows/magento2-test-phpunit-module-ghas.yaml
    with:
      module_path: ./extensions/${{ github.event.repository.name }}/.github/fixtures/demo-package-unit-only
      magento_distribution: 'mage-os'
      magento_version: '3.6.0'
      run_unit_tests: true

  # php_version override - 2.4.8 computes to php8.4, but samjuk/magento-ci-testing-env
  # also publishes a 2.4.8-php8.3 image, so this proves the override actually takes the
  # container off the computed PHP version rather than being silently ignored.
  test-php-version-override:
    uses: ./.github/workflows/magento2-test-phpunit-module-ghas.yaml
    with:
      module_path: ./extensions/${{ github.event.repository.name }}/.github/fixtures/demo-package-unit-only
      php_version: '8.3'
      run_unit_tests: true
