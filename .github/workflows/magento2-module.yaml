name: Magento 2 Module CI

on:
  workflow_call:
    inputs:
      directory:
        description: 'Module directory, relative to the repository root'
        required: false
        type: string
        default: '.'
      exclude:
        description: 'Magento versions (or glob patterns, e.g. "2.4.6*") to skip in the PHPUnit matrix, one per line'
        required: false
        type: string
        default: ''
      run_unit_tests:
        description: 'Run Test/Unit when it exists'
        required: false
        type: boolean
        default: true
      run_integration_tests:
        description: 'Run Test/Integration when it exists'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  lint:
    name: Linter
    uses: $/.github/workflows/magento2-test-lint.yaml
    with:
      directory: ${{ inputs.directory }}
      php: false # each PHPUnit cell lints on its own PHP

  static:
    name: Static Analysis
    needs: lint
    uses: $/.github/workflows/magento2-test-static.yaml
    with:
      directory: ${{ inputs.directory }}

  dependencies:
    name: Dependencies
    needs: lint
    uses: $/.github/workflows/magento2-test-dependencies-module.yaml
    with:
      module_path: ./extensions/${{ github.event.repository.name }}/${{ inputs.directory }}

  supported-versions:
    name: Supported Versions
    uses: $/.github/workflows/magento-supported-versions.yaml
    with:
      exclude: ${{ inputs.exclude }}

  phpunit:
    name: PHPUnit Tests (GHAS)
    needs: supported-versions
    uses: $/.github/workflows/magento2-test-phpunit-module-ghas.yaml
    with:
      module_path: ./extensions/${{ github.event.repository.name }}/${{ inputs.directory }}
      magento_version: ${{ matrix.version }}
      magento_distribution: ${{ matrix.distribution }}
      run_unit_tests: ${{ inputs.run_unit_tests }}
      run_integration_tests: ${{ inputs.run_integration_tests }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.supported-versions.outputs.versions) }}

  # The one check to require in a ruleset: the matrix check names change with every Magento release.
  required:
    name: Required
    if: always()
    needs: [lint, static, dependencies, supported-versions, phpunit]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
        env:
          NEEDS: ${{ toJSON(needs) }}
