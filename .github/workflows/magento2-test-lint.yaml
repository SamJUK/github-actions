name: Magento2 Linter

on:
  workflow_call:
    inputs:
      php_version:
        required: false
        type: string
        default: "8.4"
        description: "PHP Version to use"
      composer_version:
        required: false
        type: string
        default: "2.8"
        description: "Composer Version to use"
      directory:
        required: false
        type: string
        default: "."
        description: "Directory to lint"

      timeout_minutes:
        description: 'Per-job timeout. Raise it for a large integration suite; the default only exists to stop a hung job running to GitHub''s 360 minute ceiling.'
        required: false
        type: number
        default: 60

# One job, not four: each check takes seconds, but every job bills a whole minute plus a VM boot.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set PHP & Composer Version
        uses: shivammathur/setup-php@8358ee0e2e8afe63c2fb8253d1d52085811ab1e5 # v2
        with:
          php-version: ${{ inputs.php_version }}
          tools: composer:${{ inputs.composer_version }}

      - name: Validating Composer
        run: composer validate --no-check-publish

      # Projects commit a lock file, modules usually don't. --ignore-unreachable skips private
      # repositories (repo.magento.com, Hyvä's Packagist) that would 401 without credentials;
      # advisories come from packagist.org either way.
      - name: Composer Audit
        if: hashFiles('composer.lock') != ''
        run: composer audit --locked --abandoned=report --ignore-unreachable

      # .phtml too: a broken template is never compiled by setup:di:compile or static content deploy,
      # so it only fails on the page that renders it.
      - name: Lint PHP Files
        run: |
          set +e
          find ${{ inputs.directory }} -type f \( -name '*.php' -o -name '*.phtml' \) -exec php -d display_errors=stderr -l {} \; 2>&1 | grep -v "^No syntax errors detected"
          test $? -eq 0 && exit 1 || exit 0

      # Well-formedness only. Malformed layout XML, like a broken template, only fails at runtime.
      - name: Lint XML Files
        run: |
          # shellcheck disable=SC2016 # single quotes on purpose: PHP code, not shell
          find ${{ inputs.directory }} -type f -name '*.xml' -print0 \
            | xargs -0 -r php -d display_errors=stderr -r '$failed = 0; foreach (array_slice($argv, 1) as $file) { $failed |= !(new DOMDocument())->load($file); } exit($failed);'
