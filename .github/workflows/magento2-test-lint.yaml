name: Magento2 Linter

on:
  workflow_call:
    inputs:
      php_version:
        required: false
        type: string
        default: "8.4"
        description: "PHP Version to use"
      composer_version:
        required: false
        type: string
        default: "2.8"
        description: "Composer Version to use"
      directory:
        required: false
        type: string
        default: "."
        description: "Directory to lint"
      php:
        required: false
        type: boolean
        default: true
        description: "Run php -l. magento2-module turns it off and lints in each PHPUnit cell instead, on that cell's PHP"
      timeout_minutes:
        description: 'Per-job timeout. Raise it for a large integration suite; the default only exists to stop a hung job running to GitHub''s 360 minute ceiling.'
        required: false
        type: number
        default: 60

jobs:
  composer:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          sparse-checkout: |
            ${{ inputs.directory }}/composer.json
            ${{ inputs.directory }}/composer.lock
          persist-credentials: false

      - name: Set PHP & Composer Version
        uses: shivammathur/setup-php@9a96576163ad88ed6f6f2cbf381c5229baf95677 # v2
        with:
          php-version: ${{ inputs.php_version }}
          tools: composer:${{ inputs.composer_version }}

      - name: Validating Composer
        run: composer validate --no-check-publish --working-dir="${INPUTS_DIRECTORY}"
        env:
          INPUTS_DIRECTORY: ${{ inputs.directory }}

  php:
    if: inputs.php
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set PHP Version
        uses: shivammathur/setup-php@9a96576163ad88ed6f6f2cbf381c5229baf95677 # v2
        with:
          php-version: ${{ inputs.php_version }}

      - name: Lint PHP Files
        run: |
          # Exit code, not output: deprecation notices print but aren't errors.
          # shellcheck disable=SC2016 # $1 expands in the inner sh, not here.
          find "${INPUTS_DIRECTORY}" -type f -name '*.php' -print0 \
            | xargs -0 -r -n1 sh -c 'php -d display_errors=stderr -d log_errors=0 -l "$1" >/dev/null || exit 1' _
        env:
          INPUTS_DIRECTORY: ${{ inputs.directory }}

  yaml:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Tooling
        # Usually on the runner image already; install only when missing, from a fresh index.
        run: command -v yamllint || { sudo apt-get update -qq && sudo apt-get install -y yamllint; }

      # yamllint's default config fails on lines over 80 characters. Fall back to its relaxed
      # preset, which still fails on broken YAML, unless the repository brings its own config.
      - name: Lint YAML Files
        run: |
          config=(-d relaxed)
          for f in .yamllint .yamllint.yaml .yamllint.yml; do [ -f "$f" ] && config=(); done
          find "${INPUTS_DIRECTORY}" -type f \( -name '*.yml' -o -name '*.yaml' \) -exec yamllint "${config[@]}" {} \+
        env:
          INPUTS_DIRECTORY: ${{ inputs.directory }}

  xml:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Tooling
        # Usually on the runner image already; install only when missing, from a fresh index.
        run: command -v xmllint || { sudo apt-get update -qq && sudo apt-get install -y libxml2-utils; }

      - name: Lint XML Files
        run: |
          find "${INPUTS_DIRECTORY}" -type f -name '*.xml' -exec xmllint --noout {} \+
        env:
          INPUTS_DIRECTORY: ${{ inputs.directory }}
