name: Magento Supported Versions

on:
  workflow_call:
    inputs:
      include:
        description: 'Extra Magento versions to add to the supported list, one per line'
        required: false
        type: string
        default: ''
      exclude:
        description: 'Magento versions (or glob patterns, e.g. "2.4.9*") to remove from the supported list, one per line'
        required: false
        type: string
        default: ''
      timeout_minutes:
        description: 'Per-job timeout. Raise it for a large integration suite; the default only exists to stop a hung job running to GitHub''s 360 minute ceiling.'
        required: false
        type: number
        default: 60
    outputs:
      versions:
        description: 'JSON array of {distribution, version} objects, for use in a matrix (fromJson(...))'
        value: ${{ jobs.compute.outputs.versions }}

jobs:
  compute:
    name: Compute Supported Versions
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      versions: ${{ steps.compute.outputs.versions }}
    steps:
      - name: Compute Supported Versions
        id: compute
        uses: $/.github/actions/magento/supported-versions
        with:
          include: ${{ inputs.include }}
          exclude: ${{ inputs.exclude }}
