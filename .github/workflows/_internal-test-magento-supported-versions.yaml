name: Test magento-supported-versions

on:
  push:
    branches: [master]
    paths:
      - .github/actions/magento/supported-versions/**
      - .github/actions/magento/compute-software-requirements/manifest.json
      - .github/workflows/magento-supported-versions.yaml
      - .github/workflows/_internal-test-magento-supported-versions.yaml
  pull_request:
    paths:
      - .github/actions/magento/supported-versions/**
      - .github/actions/magento/compute-software-requirements/manifest.json
      - .github/workflows/magento-supported-versions.yaml
      - .github/workflows/_internal-test-magento-supported-versions.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The reusable workflow only passes its inputs through to the action.
  workflow:
    uses: ./.github/workflows/magento-supported-versions.yaml
    with:
      include: 2.4.3-p17
      exclude: mage-os:*

  test:
    name: Test
    needs: workflow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Default list
        id: default
        uses: ./.github/actions/magento/supported-versions

      - name: Bare include/exclude and globs
        id: globs
        uses: ./.github/actions/magento/supported-versions
        with:
          include: |
            2.4.3-p17
            2.4.2
            2.4.99-p1
          exclude: |
            2.4.2
            2.4.99*
            mage-os:*

      - name: Distribution-qualified include/exclude
        id: scoped
        uses: ./.github/actions/magento/supported-versions
        with:
          include: |
            mage-os:2.3.0
            mage-os:2.2.0
          exclude: |
            mage-os:2.2.0

      # Expected lists are built from versions.json so patch bumps don't need test edits.
      - name: Assert
        shell: bash
        env:
          VERSIONS: .github/actions/magento/supported-versions/versions.json
          MANIFEST: .github/actions/magento/compute-software-requirements/manifest.json
          DEFAULT: ${{ steps.default.outputs.versions }}
          GLOBS: ${{ steps.globs.outputs.versions }}
          SCOPED: ${{ steps.scoped.outputs.versions }}
          WORKFLOW: ${{ needs.workflow.outputs.versions }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          check() {
            local name=$1 actual=$2 expected
            expected=$(jq -c "[to_entries[] | .key as \$d | .value[] | {distribution: \$d, version: .}] | $3" "$VERSIONS")
            [[ $actual == "$expected" ]] || fail "$name: expected $expected, got $actual"
          }

          check default "$DEFAULT" '.'
          check globs "$GLOBS" 'map(select(.distribution == "magento")) + [{distribution: "magento", version: "2.4.3-p17"}]'
          check scoped "$SCOPED" '. + [{distribution: "mage-os", version: "2.3.0"}]'
          check workflow "$WORKFLOW" 'map(select(.distribution == "magento")) + [{distribution: "magento", version: "2.4.3-p17"}]'

          missing=$(jq -r --slurpfile m "$MANIFEST" 'to_entries[] | .key as $d | .value[] | select($m[0][$d][.] == null) | "\($d):\(.)"' "$VERSIONS")
          [[ -z $missing ]] || fail "no compute-software-requirements entry for: $missing"
