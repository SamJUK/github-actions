name: Magento2 Static Analysis

on:
  workflow_call:
    inputs:
      magento_mirror:
        required: false
        type: string
        default: "https://mage-os.hypernode.com/mirror/"
        description: "Magento Mirror URL (empty string to Disable)"
      php_version:
        required: false
        type: string
        default: "8.4"
        description: "PHP Version to use"
      directory:
        required: false
        type: string
        default: "."
        description: "Directory to lint"
      phpcs_severity:
        required: false
        type: string
        default: "6"
        description: "PHPCS severity level"
      phpcs_write_config:
        required: false
        type: boolean
        default: true
        description: "Whether to write a shared PHPCS config file"
      phpstan_level:
        required: false
        type: string
        default: "5"
        description: "PHPStan analysis level"

      timeout_minutes:
        description: 'Per-job timeout. Raise it for a large integration suite; the default only exists to stop a hung job running to GitHub''s 360 minute ceiling.'
        required: false
        type: number
        default: 60

jobs:
  phpcs:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@8358ee0e2e8afe63c2fb8253d1d52085811ab1e5 # v2
        with:
          php-version: ${{ inputs.php_version }}
          tools: phpcs

      - name: Setup Magento Mirror
        if: ${{ inputs.magento_mirror != '' }}
        run: |
          composer config --global repositories.magentomirror composer "${{ inputs.magento_mirror }}" && \
          composer config --global --no-plugins allow-plugins.phpstan/extension-installer true && \
          composer config --global --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true && \
          composer config --global --no-plugins allow-plugins.magento/* true && \
          composer config --global --no-plugins allow-plugins.laminas/laminas-dependency-plugin true && \
          composer config --global --no-plugins allow-plugins.php-http/discovery true && \
          composer config --global --no-plugins allow-plugins.phpro/grumphp true

      - name: Setup PHPCS Magento2 Standard
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require magento/magento-coding-standard magento/php-compatibility-fork
          phpcs --config-set installed_paths ../../magento/magento-coding-standard,../../magento/php-compatibility-fork/PHPCompatibility

      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Create shared PHPCS ruleset
        if: ${{ inputs.phpcs_write_config }}
        run: |
          cat <<'EOF' > phpcs.xml
          <?xml version="1.0"?>
          <ruleset name="Magento2 Shared Rules">
      
              <!-- Base Magento2 standard -->
              <rule ref="Magento2"/>
      
              <!-- Disable brace-on-same-line warning -->
              <rule ref="Squiz.Functions.MultiLineFunctionDeclaration">
                  <exclude name="Squiz.Functions.MultiLineFunctionDeclaration.BraceOnSameLine"/>
              </rule>
          
              <!-- Disable content-before-closing-brace warning -->
              <rule ref="Squiz.WhiteSpace.ScopeClosingBrace">
                  <exclude name="Squiz.WhiteSpace.ScopeClosingBrace.ContentBefore"/>
              </rule>

              <!-- Magento docblocks are often noisy / incorrect -->
              <rule ref="Magento2.Commenting.ClassPropertyPHPDocFormatting">
                  <severity>0</severity>
              </rule>
          
              <!-- Descriptive Naming & Type Hints negates comment block requirement -->
              <rule ref="Magento2.Annotation.MethodAnnotationStructure.NoCommentBlock">
                  <severity>0</severity>
              </rule>
          
              <!-- Allow longer lines (XML, DI, UI components) -->
              <rule ref="Generic.Files.LineLength">
                  <properties>
                      <property name="lineLimit" value="140"/>
                      <property name="absoluteLineLimit" value="180"/>
                  </properties>
              </rule>
          
              <!-- Disable overly pedantic spacing rules -->
              <rule ref="Squiz.WhiteSpace.ControlStructureSpacing">
                  <severity>0</severity>
              </rule>
      
          </ruleset>
          EOF

      - name: Run PHPCS
        run: |
          phpcs --standard=phpcs.xml --extensions=php,phtml -p ${{ inputs.directory }} --severity=${{ inputs.phpcs_severity }}

  phpstan:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@8358ee0e2e8afe63c2fb8253d1d52085811ab1e5 # v2
        with:
          php-version: ${{ inputs.php_version }}
          tools: phpstan

      - name: Setup Magento Mirror
        if: ${{ inputs.magento_mirror != '' }}
        run: |
          composer config --global repositories.magentomirror composer "${{ inputs.magento_mirror }}" && \
          composer config --global --no-plugins allow-plugins.phpstan/extension-installer true && \
          composer config --global --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true && \
          composer config --global --no-plugins allow-plugins.magento/* true && \
          composer config --global --no-plugins allow-plugins.laminas/laminas-dependency-plugin true && \
          composer config --global --no-plugins allow-plugins.php-http/discovery true && \
          composer config --global --no-plugins allow-plugins.phpro/grumphp true

      - name: Install PHPStan Magento Extension
        run: |
          composer global config --no-plugins allow-plugins.phpstan/extension-installer true
          composer global require phpstan/extension-installer
          composer global require bitexpert/phpstan-magento

      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install Module Dependencies
        working-directory: ${{ inputs.directory }}
        env:
          COMPOSER_NO_SECURITY_BLOCKING: 1
        # A module's lock file never reaches a store, so resolve from composer.json as a store would.
        run: composer update --no-interaction --no-progress

      # Only what the module declares is installed, so an undeclared dependency fails here too.
      # The module's own phpstan.neon(.dist) wins; phpstan_level only applies without one.
      - name: Run PHPStan
        working-directory: ${{ inputs.directory }}
        env:
          INPUTS_PHPSTAN_LEVEL: ${{ inputs.phpstan_level }}
        run: |
          CONFIG=""
          for f in phpstan.neon phpstan.neon.dist; do [ -f "$f" ] && CONFIG=$f && break; done
          {
            [ -n "$CONFIG" ] && printf 'includes:\n    - %s\n' "$CONFIG"
            echo 'parameters:'
            echo '    bootstrapFiles: [vendor/autoload.php]'
            # Integration tests use Magento\TestFramework, which only exists inside a Magento install.
            echo '    excludePaths: [vendor, Test/Integration (?)]'
            [ -z "$CONFIG" ] && echo "    level: $INPUTS_PHPSTAN_LEVEL"
            grep -qsE '^\s+paths:' "$CONFIG" || echo '    paths: [.]'
          } > phpstan.ci.neon
          PHPSTAN=phpstan
          [ -x vendor/bin/phpstan ] && PHPSTAN=vendor/bin/phpstan
          "$PHPSTAN" analyse --no-progress --configuration phpstan.ci.neon
